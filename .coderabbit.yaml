# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

language: en-GB

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false

  path_filters:
    - "!**/*.png"
    - "!**/*.jpg"

  tools:
    markdownlint:
      enabled: false
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    shellcheck:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - CLAUDE.md
